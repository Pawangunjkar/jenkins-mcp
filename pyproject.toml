[project]
name = "jenkins-mcp"
version = "1.0.0"
description = "MCP server for Jenkins CI/CD operations — 53 tools for job management, builds, pipelines, nodes, credentials, plugins, and more"
requires-python = ">=3.10"
authors = [
    { name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "jenkins", "ci-cd", "devops", "build-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
jenkins-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/Pawangunjkar/jenkins-mcp"
Repository = "https://github.com/Pawangunjkar/jenkins-mcp"
Issues = "https://github.com/Pawangunjkar/jenkins-mcp/issues"
Documentation = "https://github.com/Pawangunjkar/jenkins-mcp#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "jenkins_client.py",
    "credential_store.py",
    "README.md",
    "LICENSE",
]
